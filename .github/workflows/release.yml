name: Release

on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Refuse to publish before checking anything else out. Without a real
      # keystore the build silently falls back to the debug key that lives in
      # this repo - and once users install a debug-signed APK, a properly signed
      # update can no longer install over it.
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.TALLY_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.TALLY_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TALLY_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::TALLY_KEYSTORE_BASE64 is not set - refusing to publish a debug-signed APK."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::TALLY_SUPABASE_URL/TALLY_SUPABASE_ANON_KEY are not set - refusing to publish a build with no backend."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.11.0'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      # react-native-dotenv inlines these into the JS bundle at build time
      # (see src/shared/supabase.ts). .env is gitignored, so without this the
      # release build would silently bundle `undefined` for both - the app
      # would install fine and break only at sign-in.
      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.TALLY_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TALLY_SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      # fastlane's gradle action shells out to ./gradlew itself, so this cannot
      # be worked around in the lane - see the note in ci.yml.
      - run: chmod +x android/gradlew

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.TALLY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tally-release.jks"

      # The build and the publish both live in fastlane/Fastfile, so running a
      # release locally and running it here are the same code path. Signing
      # arrives through ORG_GRADLE_PROJECT_* rather than -P, so the passwords
      # never reach the process list. The key alias is not set here - it is a
      # plain identifier and lives in fastlane/.env.default, which fastlane
      # loads on both sides.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_TALLY_STORE_FILE: ${{ runner.temp }}/tally-release.jks
          ORG_GRADLE_PROJECT_TALLY_STORE_PASSWORD: ${{ secrets.TALLY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TALLY_KEY_PASSWORD: ${{ secrets.TALLY_KEY_PASSWORD }}
        run: bundle exec fastlane android github

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tally-release.jks"
