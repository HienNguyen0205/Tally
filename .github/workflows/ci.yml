name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.11.0'
          cache: npm

      - run: npm ci

      # lint + typecheck + jest. Same script contributors run locally, so a
      # green terminal and a green CI mean the same thing.
      - run: npm run verify

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.11.0'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Only main writes a new Gradle cache; PR branches read it back
      # read-only instead of each spawning their own entry, and cleanup
      # strips unused cache content before saving - both keep the repo's
      # 10GB Actions cache budget from filling up with stale Gradle caches.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - run: npm ci

      # This repo is developed on Windows, where git sets core.filemode=false
      # and silently records gradlew as 100644. Fixing the mode in the index
      # works until the next commit from a Windows client drops it again, so the
      # workflow does not rely on it.
      - run: chmod +x android/gradlew

      # Compiles the native side too. Lint and tests cannot catch a CMake or NDK
      # break, and that is the thing most likely to fail when reanimated,
      # worklets or skia are bumped.
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.11.0'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      # Generates the Pods project and runs New Architecture codegen. Nothing
      # under ios/ has ever been compiled, so this job exists to prove the
      # platform-specific branches - the ph:// path in PhotoPicker, the
      # Platform.select font in annotate.ts, AppDelegate - at least build.
      - run: bundle exec pod install
        working-directory: ios

      # Simulator build only: no certificates involved, and running the app
      # would need a booted simulator plus a camera this platform cannot fake.
      # Compiling is the part that regresses silently.
      - run: |
          xcodebuild build \
            -workspace ios/PeopleDetector.xcworkspace \
            -scheme PeopleDetector \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
